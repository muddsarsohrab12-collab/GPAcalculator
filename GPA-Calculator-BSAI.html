<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>GPA & CGPA Calculator — BSAI (A)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0a0e1a;
  --surface:   #111827;
  --card:      #1a2235;
  --border:    #2a3550;
  --gold:      #f5c842;
  --gold2:     #e8a020;
  --blue:      #4f8ef7;
  --text:      #e8eaf6;
  --muted:     #8899bb;
  --success:   #43d97b;
  --danger:    #ff5c5c;
  --radius:    16px;
  --shadow:    0 8px 40px rgba(0,0,0,0.5);
  --transition: 0.35s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] {
  --bg:      #f0f3fb;
  --surface: #ffffff;
  --card:    #f7f9ff;
  --border:  #dde3f0;
  --text:    #1a2235;
  --muted:   #6677aa;
  --shadow:  0 8px 40px rgba(79,142,247,0.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
}

/* ── BACKGROUND MESH ── */
body::before {
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 10%, rgba(79,142,247,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 90%, rgba(245,200,66,0.08) 0%, transparent 70%);
  transition: opacity var(--transition);
}
[data-theme="light"] body::before { opacity:0.5; }

.wrapper {
  position: relative; z-index: 1;
  max-width: 600px;
  margin: 0 auto;
  padding: 28px 16px 60px;
}

/* ── HEADER ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px;
  animation: fadeDown 0.6s ease both;
}
.brand { display:flex; flex-direction:column; }
.brand-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.4rem, 4vw, 1.9rem);
  font-weight: 900;
  background: linear-gradient(90deg, var(--gold), var(--blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
  line-height: 1.1;
}
.brand-sub {
  font-size: 0.72rem; font-weight: 500; color: var(--muted);
  letter-spacing: 2px; text-transform: uppercase; margin-top: 3px;
}

/* ── THEME TOGGLE ── */
.theme-btn {
  width: 52px; height: 28px;
  background: var(--border); border: none; border-radius: 50px;
  cursor: pointer; position: relative; transition: background var(--transition);
  flex-shrink: 0;
}
.theme-btn::after {
  content: '';
  position: absolute; top: 4px; left: 4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--gold);
  transition: transform var(--transition), background var(--transition);
  box-shadow: 0 2px 8px rgba(245,200,66,0.4);
}
[data-theme="light"] .theme-btn::after {
  transform: translateX(24px);
  background: var(--blue);
  box-shadow: 0 2px 8px rgba(79,142,247,0.4);
}
.theme-icon {
  position:absolute; top:50%; transform:translateY(-50%);
  font-size: 10px; pointer-events:none; transition: opacity 0.2s;
}
.theme-icon.moon { left: 6px; }
.theme-icon.sun  { right: 5px; opacity: 0; }
[data-theme="light"] .theme-icon.moon { opacity:0; }
[data-theme="light"] .theme-icon.sun  { opacity:1; }

/* ── TAB SWITCHER ── */
.tab-bar {
  display: flex; background: var(--card);
  border: 1px solid var(--border); border-radius: 50px;
  padding: 5px; margin-bottom: 30px; gap: 4px;
  animation: fadeDown 0.7s ease both;
  box-shadow: 0 2px 20px rgba(0,0,0,0.15);
}
.tab-btn {
  flex: 1; padding: 11px 10px; border: none; border-radius: 50px;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem; font-weight: 600; letter-spacing: 0.3px;
  background: transparent; color: var(--muted);
  transition: all var(--transition);
  position: relative; overflow: hidden;
}
.tab-btn.active {
  background: linear-gradient(135deg, var(--blue), #7b6fef);
  color: #fff;
  box-shadow: 0 4px 20px rgba(79,142,247,0.4);
}
.tab-btn:not(.active):hover { color: var(--text); background: var(--border); }

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow);
  transition: background var(--transition), border-color var(--transition);
  animation: slideUp 0.5s ease both;
}

/* ── PAGE VIEWS ── */
.page { display: none; }
.page.active { display: block; }

/* ── SECTION TITLE ── */
.sec-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.45rem; font-weight: 700;
  margin-bottom: 4px; color: var(--text);
}
.sec-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 22px; }

/* ── INPUTS ── */
.field-group { margin-bottom: 16px; }
.field-group label {
  display: block; font-size: 0.78rem; font-weight: 600;
  color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase;
  margin-bottom: 6px;
}
.field-group input {
  width: 100%; padding: 12px 16px;
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 10px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
  outline: none; transition: all 0.2s;
}
.field-group input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
  background: var(--surface);
}
.field-group input::placeholder { color: var(--muted); opacity:0.6; }

/* ── BUTTONS ── */
.btn {
  width: 100%; padding: 13px;
  border: none; border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
  position: relative; overflow: hidden;
}
.btn-primary {
  background: linear-gradient(135deg, var(--blue) 0%, #7b6fef 100%);
  color: #fff; box-shadow: 0 4px 20px rgba(79,142,247,0.3);
  margin-bottom: 12px;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(79,142,247,0.45);
}
.btn-primary:active { transform: translateY(0); }
.btn-calc {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  color: #1a1400; box-shadow: 0 4px 20px rgba(245,200,66,0.25);
}
.btn-calc:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(245,200,66,0.45);
}

/* ── RIPPLE ── */
.btn::after {
  content:''; position:absolute; border-radius:50%;
  background: rgba(255,255,255,0.25);
  width: 100px; height: 100px;
  top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
  transition: transform 0.4s, opacity 0.4s;
  opacity: 0;
}
.btn:active::after { transform:translate(-50%,-50%) scale(3); opacity:0; transition:0s; }

/* ── SUBJECT CARDS ── */
.subjects-container { margin: 20px 0; display: flex; flex-direction: column; gap: 12px; }
.subject-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  animation: slideUp 0.35s ease both;
  transition: border-color 0.2s;
}
.subject-card:hover { border-color: var(--blue); }
.subject-card .subject-num {
  grid-column: 1/-1; font-size: 0.72rem; font-weight: 700;
  color: var(--blue); letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 2px;
}

/* ── SEMESTER CARDS ── */
.semester-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
  animation: slideUp 0.35s ease both;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.semester-card:hover { border-color: var(--gold); }
.semester-card .sem-num {
  font-size: 0.72rem; font-weight: 700;
  color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 10px;
}
.sem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── RESULT ── */
.result-box {
  margin-top: 20px; padding: 22px;
  border-radius: 14px; text-align: center;
  background: linear-gradient(135deg, rgba(79,142,247,0.12), rgba(123,111,239,0.12));
  border: 1px solid rgba(79,142,247,0.25);
  display: none; animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1) both;
}
.result-box.show { display: block; }
.result-label { font-size: 0.75rem; color: var(--muted); letter-spacing: 1.5px; text-transform:uppercase; margin-bottom: 8px; }
.result-value {
  font-family: 'Playfair Display', serif;
  font-size: 3.2rem; font-weight: 900; line-height: 1;
  background: linear-gradient(90deg, var(--gold), var(--blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.result-grade {
  font-size: 1rem; font-weight: 600; margin-top: 8px; color: var(--text);
}
.result-msg {
  font-size: 0.82rem; color: var(--muted); margin-top: 6px; font-style: italic;
}

/* ── CGPA RESULT ── */
.result-box.cgpa-mode {
  background: linear-gradient(135deg, rgba(245,200,66,0.10), rgba(232,160,32,0.10));
  border: 1px solid rgba(245,200,66,0.25);
}

/* ── DIVIDER ── */
.divider {
  height: 1px; background: var(--border); margin: 20px 0;
}

/* ── FOOTER ── */
footer {
  text-align: center; margin-top: 36px;
  font-size: 0.75rem; color: var(--muted); letter-spacing: 0.5px;
  animation: fadeDown 1s ease both;
}
footer span { color: var(--gold); font-weight: 600; }

/* ── ANIMATIONS ── */
@keyframes fadeDown {
  from { opacity:0; transform:translateY(-18px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes slideUp {
  from { opacity:0; transform:translateY(22px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes popIn {
  from { opacity:0; transform:scale(0.88); }
  to   { opacity:1; transform:scale(1); }
}

/* ── ANIMATED NUMBER COUNTER ── */
.counting { display:inline-block; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* ── MOBILE ── */
@media (max-width: 480px) {
  .card { padding: 20px 16px; }
  .subject-card { grid-template-columns: 1fr; }
  .sem-grid { grid-template-columns: 1fr; }
  .result-value { font-size: 2.6rem; }
}
</style>
</head>
<body>

<div class="wrapper">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-title">GPA & CGPA Calculator</div>
      <div class="brand-sub">BSAI (A) &nbsp;·&nbsp; Academic Tools</div>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle dark/light mode">
      <span class="theme-icon moon">🌙</span>
      <span class="theme-icon sun">☀️</span>
    </button>
  </header>

  <!-- TAB SWITCHER -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-gpa" onclick="switchTab('gpa')">📊 GPA Calculator</button>
    <button class="tab-btn" id="tab-cgpa" onclick="switchTab('cgpa')">🎓 CGPA Calculator</button>
  </div>

  <!-- ════ GPA PAGE ════ -->
  <div class="page active" id="page-gpa">
    <div class="card">
      <div class="sec-title">Semester GPA</div>
      <div class="sec-sub">Enter marks out of 100 and credit hours per subject</div>

      <div class="field-group">
        <label>Number of Subjects</label>
        <input type="number" id="subjectCount" min="1" max="20" placeholder="e.g. 6">
      </div>
      <button class="btn btn-primary" onclick="createSubjects()">➕ Add Subjects</button>

      <div class="subjects-container" id="subjects"></div>

      <div class="divider" id="calcDivider" style="display:none;"></div>
      <button class="btn btn-calc" id="calcGpaBtn" style="display:none;" onclick="calculateGPA()">⚡ Calculate GPA</button>

      <div class="result-box" id="gpaResult">
        <div class="result-label">Your GPA</div>
        <div class="result-value" id="gpaValue">—</div>
        <div class="result-grade" id="gpaGrade"></div>
        <div class="result-msg" id="gpaMsg"></div>
      </div>
    </div>
  </div>

  <!-- ════ CGPA PAGE ════ -->
  <div class="page" id="page-cgpa">
    <div class="card">
      <div class="sec-title">Cumulative CGPA</div>
      <div class="sec-sub">Enter GPA and total credit hours for each semester</div>

      <div class="field-group">
        <label>Number of Semesters</label>
        <input type="number" id="semesterCount" min="1" max="12" placeholder="e.g. 4">
      </div>
      <button class="btn btn-primary" onclick="createSemesters()">➕ Add Semesters</button>

      <div id="semesterInputs"></div>

      <div class="divider" id="cgpaCalcDivider" style="display:none;"></div>
      <button class="btn btn-calc" id="calcCgpaBtn" style="display:none;" onclick="calculateCGPA()">⚡ Calculate CGPA</button>

      <div class="result-box cgpa-mode" id="cgpaResult">
        <div class="result-label">Your CGPA</div>
        <div class="result-value" id="cgpaValue">—</div>
        <div class="result-grade" id="cgpaGrade"></div>
        <div class="result-msg" id="cgpaMsg"></div>
      </div>
    </div>
  </div>

  <footer>
    Built with ❤️ by <span>BSAI (A)</span> &nbsp;·&nbsp; Academic Excellence Tools
  </footer>

</div>

<script>
// ── THEME ──
function toggleTheme() {
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

// ── TABS ──
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

// ── GRADE POINT TABLE (exact original logic) ──
function getGradePoint(marks) {
  if (marks < 50) return 0.00;
  if (marks === 50) return 1.00;
  if (marks === 51) return 1.08;
  if (marks === 52) return 1.17;
  if (marks === 53) return 1.25;
  if (marks === 54) return 1.33;
  if (marks === 55) return 1.42;
  if (marks === 56) return 1.50;
  if (marks === 57) return 1.58;
  if (marks === 58) return 1.67;
  if (marks === 59) return 1.75;
  if (marks === 60) return 1.83;
  if (marks === 61) return 1.92;
  if (marks === 62) return 2.00;
  if (marks === 63) return 2.08;
  if (marks === 64) return 2.17;
  if (marks === 65) return 2.25;
  if (marks === 66) return 2.33;
  if (marks === 67) return 2.42;
  if (marks === 68) return 2.50;
  if (marks === 69) return 2.58;
  if (marks === 70) return 2.67;
  if (marks === 71) return 2.75;
  if (marks === 72) return 2.83;
  if (marks === 73) return 2.92;
  if (marks === 74) return 3.00;
  if (marks === 75) return 3.08;
  if (marks === 76) return 3.17;
  if (marks === 77) return 3.25;
  if (marks === 78) return 3.33;
  if (marks === 79) return 3.42;
  if (marks === 80) return 3.50;
  if (marks === 81) return 3.60;
  if (marks === 82) return 3.70;
  if (marks === 83) return 3.80;
  if (marks === 84) return 3.90;
  return 4.00;
}

function getLetterGrade(gpa) {
  if (gpa >= 3.7) return 'A+';
  if (gpa >= 3.3) return 'A';
  if (gpa >= 3.0) return 'A−';
  if (gpa >= 2.7) return 'B+';
  if (gpa >= 2.3) return 'B';
  if (gpa >= 2.0) return 'B−';
  if (gpa >= 1.7) return 'C+';
  if (gpa >= 1.3) return 'C';
  if (gpa >= 1.0) return 'C−';
  return 'F';
}

function getMotivation(gpa) {
  if (gpa >= 3.7) return '🏆 Excellent! You are in the top students of your class!';
  if (gpa >= 3.0) return '⭐ Great work! Keep pushing for excellence!';
  if (gpa >= 2.0) return '💪 Good effort — you can reach even higher!';
  if (gpa >= 1.0) return '📚 Keep studying hard — improvement is possible!';
  return '❌ Below passing — focus and seek help from your teachers.';
}

// ── GPA: CREATE SUBJECTS ──
function createSubjects() {
  const count = parseInt(document.getElementById('subjectCount').value);
  if (!count || count < 1 || count > 20) { shakeInput('subjectCount'); return; }

  const container = document.getElementById('subjects');
  container.innerHTML = '';

  for (let i = 1; i <= count; i++) {
    const div = document.createElement('div');
    div.className = 'subject-card';
    div.style.animationDelay = (i * 0.06) + 's';
    div.innerHTML = `
      <div class="subject-num">Subject ${i}</div>
      <div class="field-group">
        <label>Marks (0–100)</label>
        <input type="number" class="marks" min="0" max="100" placeholder="e.g. 75">
      </div>
      <div class="field-group">
        <label>Credit Hours</label>
        <input type="number" class="credits" min="1" max="6" placeholder="e.g. 3">
      </div>
    `;
    container.appendChild(div);
  }

  document.getElementById('calcDivider').style.display = 'block';
  document.getElementById('calcGpaBtn').style.display = 'block';
  document.getElementById('gpaResult').classList.remove('show');
}

// ── GPA: CALCULATE ──
function calculateGPA() {
  const marks   = document.getElementsByClassName('marks');
  const credits = document.getElementsByClassName('credits');

  if (marks.length === 0) { alert('Please add subjects first.'); return; }

  let totalPoints = 0, totalCredits = 0;
  let valid = true;

  for (let i = 0; i < marks.length; i++) {
    const m = parseInt(marks[i].value);
    const c = parseInt(credits[i].value);
    if (isNaN(m) || isNaN(c) || m < 0 || m > 100 || c < 1) { valid = false; break; }
    totalPoints += getGradePoint(m) * c;
    totalCredits += c;
  }

  if (!valid || totalCredits === 0) {
    alert('Please fill all subject marks (0–100) and credit hours correctly.');
    return;
  }

  const gpa = (totalPoints / totalCredits).toFixed(2);
  const letter = getLetterGrade(parseFloat(gpa));
  const msg = getMotivation(parseFloat(gpa));

  const resultBox = document.getElementById('gpaResult');
  resultBox.classList.remove('show');
  void resultBox.offsetWidth;
  resultBox.classList.add('show');

  animateNumber('gpaValue', 0, parseFloat(gpa), 800, 2);
  document.getElementById('gpaGrade').textContent = 'Letter Grade: ' + letter;
  document.getElementById('gpaMsg').textContent = msg;

  // Original message preserved as easter egg in console
 // console.log('Mubaraka 🎊 Isi khushi ma CR k leay Treat!');
}

// ── CGPA: CREATE SEMESTERS ──
function createSemesters() {
  const count = parseInt(document.getElementById('semesterCount').value);
  if (!count || count < 1 || count > 12) { shakeInput('semesterCount'); return; }

  const container = document.getElementById('semesterInputs');
  container.innerHTML = '';

  for (let i = 1; i <= count; i++) {
    const div = document.createElement('div');
    div.className = 'semester-card';
    div.style.animationDelay = (i * 0.07) + 's';
    div.innerHTML = `
      <div class="sem-num">Semester ${i}</div>
      <div class="sem-grid">
        <div class="field-group">
          <label>GPA</label>
          <input type="number" step="0.01" min="0" max="4" id="gpa${i}" placeholder="e.g. 3.50">
        </div>
        <div class="field-group">
          <label>Credit Hours</label>
          <input type="number" min="1" id="credits${i}" placeholder="e.g. 18">
        </div>
      </div>
    `;
    container.appendChild(div);
  }

  document.getElementById('cgpaCalcDivider').style.display = 'block';
  document.getElementById('calcCgpaBtn').style.display = 'block';
  document.getElementById('cgpaResult').classList.remove('show');
}

// ── CGPA: CALCULATE (exact original logic) ──
function calculateCGPA() {
  const count = parseInt(document.getElementById('semesterCount').value);
  let totalPoints = 0, totalCredits = 0;

  for (let i = 1; i <= count; i++) {
    const gpa     = parseFloat(document.getElementById('gpa' + i).value);
    const credits = parseFloat(document.getElementById('credits' + i).value);
    if (isNaN(gpa) || isNaN(credits)) {
      alert('Please fill all GPA and Credit fields for Semester ' + i);
      return;
    }
    totalPoints  += gpa * credits;
    totalCredits += credits;
  }

  const cgpa   = (totalPoints / totalCredits).toFixed(2);
  const letter = getLetterGrade(parseFloat(cgpa));
  const msg    = getMotivation(parseFloat(cgpa));

  const resultBox = document.getElementById('cgpaResult');
  resultBox.classList.remove('show');
  void resultBox.offsetWidth;
  resultBox.classList.add('show');

  animateNumber('cgpaValue', 0, parseFloat(cgpa), 900, 2);
  document.getElementById('cgpaGrade').textContent = 'Letter Grade: ' + letter;
  document.getElementById('cgpaMsg').textContent = msg;
}

// ── ANIMATED COUNTER ──
function animateNumber(elId, from, to, duration, decimals) {
  const el = document.getElementById(elId);
  const start = performance.now();
  function update(now) {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = (from + (to - from) * ease).toFixed(decimals);
    if (p < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// ── SHAKE INVALID INPUT ──
function shakeInput(id) {
  const el = document.getElementById(id);
  el.style.borderColor = 'var(--danger)';
  el.style.animation = 'shake 0.4s ease';
  setTimeout(() => { el.style.borderColor = ''; el.style.animation = ''; }, 600);
}

// ── SHAKE KEYFRAME (inject) ──
const style = document.createElement('style');
style.textContent = `
@keyframes shake {
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-8px); }
  40%{ transform:translateX(8px); }
  60%{ transform:translateX(-5px); }
  80%{ transform:translateX(5px); }
}`;
document.head.appendChild(style);

// ── ENTER KEY SUPPORT ──
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const activePage = document.querySelector('.page.active').id;
    if (activePage === 'page-gpa') {
      const btn = document.getElementById('calcGpaBtn');
      if (btn.style.display !== 'none') calculateGPA();
      else createSubjects();
    } else {
      const btn = document.getElementById('calcCgpaBtn');
      if (btn.style.display !== 'none') calculateCGPA();
      else createSemesters();
    }
  }
});
</script>
</body>
</html>
